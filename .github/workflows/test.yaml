name: DPP-SDK Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpp-sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Pure TypeScript library: type check -> unit suite with coverage (node:test
  # via tsx, golden vectors included) -> dual build -> packed-tarball probe
  # under both consumer compiler profiles (DAYPASS classic, NIGHTPASS NodeNext).
  # No chain, no server, no secrets.
  # =========================================================================
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build (CJS + ESM + d.ts)
        run: npm run build

      - name: Check consumer resolution
        run: npm run check:consumers

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: node-${{ matrix.node-version }}
          name: node-${{ matrix.node-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
